services:
  gateway:
    volumes:
      - ./run:/run/xiaozhi-host
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BUILD_IMAGE: ${DHI_PYTHON_BUILD_IMAGE:?pin DHI build image by digest}
        PYTHON_RUNTIME_IMAGE: ${DHI_PYTHON_RUNTIME_IMAGE:?pin DHI runtime image by digest}
    image: xiaozhi-openai-gateway:0.2-alpha
    container_name: xiaozhi-openai-gateway
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 384m
    # DS218+ DSM doesn't expose the cgroup controllers required by Compose's
    # `cpus` / NanoCPUs and `pids_limit` settings. A memory limit remains set.
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    environment:
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL}
      PUBLIC_COMPUTE_URL: ${PUBLIC_COMPUTE_URL:-}
      AI_BACKEND: ${AI_BACKEND:-}
      BACKEND: ${BACKEND:-}
      INSTRUCTIONS: ${INSTRUCTIONS:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-realtime-2.1}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_VOICE: ${OPENAI_VOICE:-marin}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_STT_MODEL: ${MISTRAL_STT_MODEL:-voxtral-mini-latest}
      MISTRAL_TTS_MODEL: ${MISTRAL_TTS_MODEL:-voxtral-mini-tts-2603}
      MISTRAL_VOICE_ID: ${MISTRAL_VOICE_ID:-}
      MISTRAL_LANGUAGE: ${MISTRAL_LANGUAGE:-nl}
      MISTRAL_TTS_GAIN: ${MISTRAL_TTS_GAIN:-1.0}
      MISTRAL_MAX_SENTENCES: ${MISTRAL_MAX_SENTENCES:-3}
      MISTRAL_TELL_DATE: ${MISTRAL_TELL_DATE:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.1.24:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      LOCAL_STT_BASE_URL: ${LOCAL_STT_BASE_URL:-}
      LOCAL_STT_TIMEOUT_SECONDS: ${LOCAL_STT_TIMEOUT_SECONDS:-}
      LOCAL_TTS_BASE_URL: ${LOCAL_TTS_BASE_URL:-}
      LOCAL_TTS_TIMEOUT_SECONDS: ${LOCAL_TTS_TIMEOUT_SECONDS:-}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-300}
      VAD_SILENCE_MS: ${VAD_SILENCE_MS:-800}
      TIMEZONE_OFFSET_MINUTES: ${TIMEZONE_OFFSET_MINUTES:-0}
      XIAOZHI_ALLOWED_DEVICE_ID: ${XIAOZHI_ALLOWED_DEVICE_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - openai_api_key
      - mistral_api_key
      - xiaozhi_device_token
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  # Both provider files exist in the current deployment; only the key required
  # by the selected backend is read by Config.
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  mistral_api_key:
    file: ./secrets/mistral_api_key.txt
  xiaozhi_device_token:
    file: ./secrets/xiaozhi_device_token.txt
