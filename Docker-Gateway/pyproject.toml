[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaozhi-openai-gateway"
version = "0.1.0a1"
description = "Minimal XiaoZhi WebSocket/Opus to OpenAI Realtime gateway"
requires-python = ">=3.12"
dependencies = ["websockets==15.0.1"]

[project.scripts]
xiaozhi-gateway = "xiaozhi_gateway.main:run"

[tool.setuptools.packages.find]
where = ["src"]
